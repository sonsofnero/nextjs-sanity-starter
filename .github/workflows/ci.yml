name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated Sanity types are committed
        run: |
          pnpm typegen
          git diff --exit-code -- sanity/schema.json site/sanity/sanity.types.ts
        env:
          SANITY_STUDIO_PROJECT_ID: ci
          SANITY_STUDIO_DATASET: production
      - name: Run unit tests
        run: pnpm test
      - name: Lint workspaces
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Check TypeScript (site and Studio)
        run: pnpm type-check
